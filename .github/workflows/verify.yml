name: Offline CVE regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out the original fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Acquire and verify the two exact upstream wheels
        run: python -B run_replay.py --fetch --output dist/setup-result.json
      - name: Repeat from the local cache with sockets disabled
        run: python -B run_replay.py --output dist/offline-result.json
